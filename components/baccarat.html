<div id="baccarat-view" class="hidden flex flex-1 flex-col overflow-y-auto no-scrollbar p-2 sm:p-3 gap-2 sm:gap-3">
        <div id="baccarat-bead-wrap" class="flex flex-col gap-1.5 flex-1 min-h-[140px]">
            <div class="flex justify-between items-center px-4 py-2 glass-pill mt-1">
                <div class="flex gap-2.5 text-[10.5px] font-black uppercase tracking-[0.1em]"><span
                        class="text-white/30 tracking-widest"><i class="fas fa-chart-pie text-[8px] mr-1 mb-0.5"></i>
                        Shoe Comp:</span><span class="text-[#0A84FF]">P: <span id="baccarat-comp-p">[0 |
                            0%]</span></span><span class="text-[#FF453A]">B: <span id="baccarat-comp-b">[0 |
                            0%]</span></span><span class="text-[#30D158]">T: <span id="baccarat-comp-t">[0 |
                            0%]</span></span></div><span id="baccarat-hands-count"
                    class="text-[10px] font-black text-white/30 uppercase tracking-[0.2em]">0 Hands</span>
            </div>
            <div id="bead-plate" class="road-container rounded-lg flex-1"></div>
        </div>
        <div class="w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
        <div id="baccarat-big-road-wrap" class="flex flex-col gap-1.5 shrink-0 h-[160px]">
            <div class="flex justify-between items-center px-1"></div>
            <div id="big-road" class="road-container rounded-lg h-full"></div>
        </div>

        <!-- BACCARAT FOOTER INPUTS (Moved inside baccarat-view) -->
        <div id="baccarat-controls"
            class="hidden glass-bar glass-surface p-3 sm:p-4 flex items-center gap-3 sm:gap-4 shrink-0 mt-auto">
            <div class="flex items-center gap-3 sm:gap-4 w-full">
                <button onclick="createRipple(event); app.baccarat.input('P')"
                    class="btn-ios btn-p flex-1 h-[60px] sm:h-[80px] rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center shadow-2xl relative overflow-hidden group">
                    <span class="text-xl sm:text-2xl font-black text-white tracking-tighter">PLAYER</span>
                    <span class="text-[9px] sm:text-[10px] font-extralight tracking-widest uppercase text-white/50 mt-1">1:1</span>
                </button>
                <button onclick="createRipple(event); app.baccarat.input('T')"
                    class="btn-ios btn-t w-[65px] sm:w-[90px] h-[52px] sm:h-[68px] rounded-xl sm:rounded-2xl flex flex-col items-center justify-center shadow-lg relative overflow-hidden">
                    <span class="text-sm sm:text-base font-black text-white">TIE</span>
                    <span class="text-[8px] sm:text-[9px] font-extralight tracking-widest uppercase text-white/50 mt-0.5">8:1</span>
                </button>
                <button onclick="createRipple(event); app.baccarat.input('B')"
                    class="btn-ios btn-b flex-1 h-[60px] sm:h-[80px] rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center shadow-2xl relative overflow-hidden group">
                    <span class="text-xl sm:text-2xl font-black text-white tracking-tighter">BANKER</span>
                    <span class="text-[9px] sm:text-[10px] font-extralight tracking-widest uppercase text-white/50 mt-1">0.95:1</span>
                </button>
            </div>
        </div>
    </div>
